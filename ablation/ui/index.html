<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人工消融测试台 · cf-coach(L2) vs 裸模型(L0)</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --fg:#e6e8ee; --dim:#9aa3b2; --line:#2a2f3a; --ok:#3fb950; --bad:#f85149; --warn:#d29922; --acc:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 "Segoe UI",system-ui,sans-serif; }
  a { color:var(--acc); }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 14px; }
  h1 { font-size:16px; margin:0 0 8px; }
  h2 { font-size:14px; margin:0 0 8px; color:var(--dim); font-weight:600; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
  .toolbar label { color:var(--dim); display:flex; gap:4px; align-items:center; }
  .lvpick { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:4px 8px; }
  .lvpick label { color:var(--fg); }
  .ladder td.lv-cell { white-space:nowrap; }
  input,select,textarea,button { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; }
  textarea { width:100%; min-height:120px; font-family:Consolas,monospace; font-size:12px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  main { padding:14px; display:grid; grid-template-columns:1fr 320px; gap:14px; }
  @media (max-width:1100px) { main { grid-template-columns:1fr; } }
  section, .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:600; }
  tr.sel { background:#1b2434; }
  .badge { display:inline-block; padding:1px 7px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .b-ok { color:var(--ok); border-color:#1f4d26; } .b-bad { color:var(--bad); border-color:#5a1f1c; }
  .b-warn { color:var(--warn); border-color:#5a451a; } .b-dim { color:var(--dim); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:1100px) { .grid2 { grid-template-columns:1fr; } }
  pre { background:#0b0e12; border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; max-height:420px; font-size:12px; margin:6px 0; }
  iframe { width:100%; height:520px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .dim { color:var(--dim); } .small { font-size:12px; }
  .kpi { display:flex; flex-wrap:wrap; gap:10px; }
  .kpi div { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:120px; }
  .kpi b { display:block; font-size:18px; }
  #log { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; height:calc(100vh - 200px); overflow:auto; font-family:Consolas,monospace; font-size:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  dialog { width:min(900px,94vw); background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:10px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .choice button.on { background:#1f6feb; border-color:#1f6feb; }
</style>
</head>
<body>
<header>
  <h1>人工消融测试台 —— 同一道题：<span style="color:var(--acc)">L0 裸模型</span> vs <span style="color:var(--ok)">L2 cf-coach</span>（合格线 = 不差于 L0）</h1>
  <div class="toolbar">
    <span id="modelInfo" class="dim small"></span>
    <label>对拍组数 <input id="it" type="number" min="1" max="2000" value="60" style="width:70px"></label>
    <label>L2 语言 <select id="lang"><option value="python">python</option><option value="cpp">cpp</option></select></label>
    <label>讲解深度 <select id="depth"><option>L3</option><option>L2</option><option>L1</option></select></label>
    <label><input id="rich" type="checkbox" checked> 生成图文文档</label>
    <span class="lvpick">
      <span class="dim small">档位</span>
      <label title="L0 裸模型：一次调用、没有工具、没有循环、没有验证。厂商宣称的 rating 上限就是这一档。"><input id="lvL0" type="checkbox" checked> L0 裸模</label>
      <label title="L0C：与 L0 逐字相同的题面与 system，只多一句「这一轮只输出一个代码块」。用来把「不懂」和「没交出来」分开 —— 实测同一份提示词加这一句，r2300/r2600 从 0/2 AC 变 2/2 AC。"><input id="lvL0C" type="checkbox"> L0 只给代码块</label>
      <label title="L0+：system 与 user 就是 L2 题解 Agent 逐字相同的那一套（harness.solutionSystem + 机械抽取的 I/O 契约 + 官方样例），但仍是一次调用、没有工具、没有暴力解/对拍/重写。判据 L2 > L0+ 的对照组：L2 减 L0+ 才是 cf-coach harness 的净贡献。"><input id="lvL0P" type="checkbox"> L0+ 同提示词</label>
      <label title="L1 裸 agent：同一个工具循环 + 通用工具面（写文件/读文件/运行/对拍）。"><input id="lvL1" type="checkbox"> L1 agent</label>
      <label title="L2 cf-coach 本体：工具链 + 三件套 + 判据 + 证据门 + 图文文档。"><input id="lvL2" type="checkbox" checked> L2 cf-coach</label>
    </span>
    <label title="同一 (题×档) 跑几遍。单次调用方差很大（实测同一题同一档有 1/3 的概率交不出代码），只跑一遍的「通过/不通过」当不了证据。">重复次数 <input id="reps" type="number" min="1" max="20" value="1" style="width:52px"></label>
    <label title="单次模型调用超时（分钟）。12 是历史默认值：实测难题单次思考 681–716s，撞上就被中止，而且那不是答错。跑 r2300+ 建议 32。">单次超时 <input id="timeout" type="number" min="1" max="180" value="12" style="width:56px"> 分钟</label>
    <label title="并发跑几道题：不同题同时跑，同一道题的多档/多遍永远串行（同题共享工作区，并行会互相清目录，数据会废得看不出来）。实测单条 L2 中位 681s，串行跑 30 题要 35 小时。">并发 <input id="conc" type="number" min="1" max="8" value="4" style="width:46px"> 题</label>
    <label title="重复方案。补齐（默认推荐）：同一 (题×档) 已经有「重复次数」那么多条同模型记录就跳过，只跑缺的格 —— 跑过几轮之后无脑重跑等于花钱重跑已经结算的格子（实测那台机器有一整轮是在重跑上一轮的格子）。每格都跑 N 遍：改过提示词/换过判据口径后用这个，别把新旧口径混进一张表。先各跑 1 遍：全池先拿到一张全景图，再按需补。只补阶梯缝：只给 rating 阶梯缝附近（已知最高 AC 与首次可信失败之间，含紧邻一档）的题跑 N 遍，其余各 1 遍。">重复方案 <select id="plan"><option value="fill">补齐（只跑缺的格）</option><option value="full">每格都跑 N 遍</option><option value="sweep">先各跑 1 遍</option><option value="ladder">只补阶梯缝</option></select></label>
    <label title="默认跳过题表里标了「判不了」的题（多解但没有 checker、或尺子贴错题）。它们只烧钱不产数据：实测 2267B + 2268F 两道烧掉 91 分钟 / ¥10.6。"><input id="includeSkipped" type="checkbox"> 连判不了的题一起跑</label>
    <button id="btnAdd">＋ 加题</button>
    <button id="btnRunSel" class="primary">跑选中题</button>
    <button id="btnRunAll">跑全部（勾的档位）</button>
    <button id="btnJudge">判分 + 配对比较</button>
    <button id="btnGens" title="给「有 oracle 但没生成器」的题各写一个随机数据生成器（一题一次模型调用 + 跑代码体检）">补生成器</button>
    <button id="btnExport">导出 JSON</button>
    <button id="btnDiag" title="导出一个纯文本证据包（这台机器上的完整现场）：环境与机器名、工作台运行日志（终端输出）、本轮设置、rating 阶梯、每一跑的明细（含重复次数/撞顶/中止）、题库与 oracle/生成器台账、工具轨迹、判分与配对结果。apiKey/cookie/邮箱/用户名已打码，不含解题代码正文。测试在别的机器上跑时，把这个文件发回来就行。">导出诊断包（发回日志）</button>
    <button id="btnCancel">取消</button>
  </div>
  <div id="progress" class="small dim" style="margin-top:6px"></div>
  <div id="hostHint" class="small dim" style="margin-top:2px"></div>
</header>

<main>
  <div>
    <section id="summary"></section>
    <section id="ceilingSection">
      <h2>rating 阶梯（这一档的 rating 上限在哪）</h2>
      <div id="ceiling"></div>
    </section>
    <section>
      <h2>题目（勾选 → 跑 / 点标题 → 看对比）</h2>
      <div id="problems"></div>
    </section>
    <section id="detailSection" style="display:none">
      <h2 id="detailTitle"></h2>
      <div id="detail"></div>
    </section>
  </div>
  <div>
    <h2>事件</h2>
    <div id="log"></div>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">加题</h2>
    <div class="grid2">
      <div>
        <div class="row"><label style="width:70px">取题</label><input id="f_ref" placeholder="1800C，或贴 CF 题目链接" style="flex:1">
          <button type="button" id="btnFetch" title="借应用内嵌浏览器过 CF 反爬，把题面/样例/标题/难度直接抓进来（20–60 秒）">从 CF 取题</button></div>
        <div class="row"><label style="width:70px"></label>
          <button type="button" id="btnImport" title="直接读应用自己抓过的题面缓存（data/cf-problems/<题号>.json）：纯本地文件，不用再过一次 CF 反爬">导应用缓存</button>
          <span id="cacheHint" class="small dim" style="flex:1"></span></div>
        <div id="fetchMsg" class="small dim"></div>
        <div class="row"><label style="width:70px">题号</label><input id="f_id" placeholder="1800C" style="flex:1"></div>
        <div class="row"><label style="width:70px">标题</label><input id="f_title" style="flex:1"></div>
        <div class="row"><label style="width:70px">rating</label><input id="f_rating" type="number" style="width:90px">
          <label style="width:60px">链接</label><input id="f_url" style="flex:1"></div>
        <div class="row"><label style="width:70px">题面</label><span class="small dim">直接粘 CF 题面全文；官方样例留空会自动解析</span></div>
        <textarea id="f_statement" style="min-height:220px" placeholder="把题面粘这里（含 Input/Output/Examples 就能自动抽出样例）；也可以点上面的「从 CF 取题」"></textarea>
        <div class="row"><label style="width:70px">样例</label><span class="small dim">（自动解析；也可手填 JSON 数组 [{"input":"1 2","output":"3"}]）</span></div>
        <textarea id="f_samples" style="min-height:70px" placeholder='留空 = 从题面自动解析'></textarea>
      </div>
      <div>
        <div class="row"><label style="width:70px">oracle</label><span class="small dim">外部 AC 题解（<b>绝不能</b>用 L2 自己产的）</span>
          <select id="f_oracleLang"><option>python</option><option>cpp</option></select></div>
        <textarea id="f_oracleCode" style="min-height:150px" placeholder="题解代码（CF 上 AC 的提交 / 题解博客的代码 / 你验证过的实现）"></textarea>
        <div class="row"><label style="width:70px">生成器</label><span class="small dim">随机数据；不用手写，点右边这个按钮让模型写 + 体检</span>
          <select id="f_genLang"><option>python</option><option>cpp</option></select>
          <button type="button" id="btnGen" title="按上面的题面与 oracle 写一个生成器，并真跑一遍体检（能不能跑、数据会不会把你的 oracle 跑崩、是否每次都一样）">自动写生成器</button></div>
        <textarea id="f_genCode" style="min-height:120px" placeholder="留空：点上面的「自动写生成器」。判分/对拍只认文件，生成器必须**不带任何命令行参数**也能产出一组数据"></textarea>
        <div class="row"><label style="width:70px">备注</label><input id="f_note" style="flex:1"></div>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button value="cancel">取消</button>
      <button id="btnSave" value="save" class="primary">保存</button>
      <button id="btnDelete" value="delete" style="color:var(--bad)">删除这道题</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
let S = null;              // /api/state
let sel = new Set();       // 勾选要跑的题
let detailId = null;       // 正在看的题
const dlg = $('dlg');
let editing = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function pct(x) { return x == null ? '—' : Math.round(x * 100) + '%'; }
function money(x) { return x == null ? '' : '¥' + (Math.round(x * 10000) / 10000); }

function logLine(s) {
  const el = $('log'); const at = new Date().toLocaleTimeString();
  el.insertAdjacentHTML('beforeend', '<div class="small"><span class="dim">' + at + '</span> ' + esc(s) + '</div>');
  el.scrollTop = el.scrollHeight;
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? undefined : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) {
    const e = new Error(j.error || ('HTTP ' + r.status));
    e.data = j;          // 带上服务端的原始字段（如 oracleBroken），调用方好分类提示
    throw e;
  }
  return j;
}

function recOf(level, id) { return (S.records || []).find((r) => r.level === level && r.problem === id) || null; }
function verdictOf(level, id) { return (S.verdicts || []).find((v) => v.level === level && v.problem === id) || null; }
function humanOf(id) { const h = (S.human || []).filter((x) => x.problem === id); return h.length ? h[h.length - 1] : null; }

/**
 * 这条记录是"降级交付的暴力解"吗？（题解 Agent 交不出代码，链把同一轮的暴力解交了上来）
 * 判据与 `ablation/lib/ladder.js` 的 `isDegradedRun`、`ablation/judge.js` 的 `deliveredBrute` 保持一致：
 * 是 brute 降级 **且** 交付的不是模型自己的解。
 */
function isDegradedRec(r) {
  if (!r) return false;
  const d = (r.verification && r.verification.degraded) || (r.verificationStatus === 'degraded-brute' ? 'brute' : null);
  return d === 'brute' && r.delivered !== 'model-first';
}

function verdictBadge(v, r) {
  if (!v) return '<span class="badge b-dim">未判分</span>';
  const map = {
    AC: ['b-ok', '差分 AC'], WA: ['b-bad', '差分 WA'], 'no-oracle': ['b-warn', '缺 oracle'],
    'no-gen': ['b-warn', '缺生成器（只能看样例）'],
    'oracle-broken': ['b-bad', '⛔ 尺子坏了（不判候选）'],
    'special-judge': ['b-warn', '多解题（样例关不算判错）'],
    'run-error': ['b-warn', '运行错误'], 'no-code': ['b-dim', '没抽到代码'], unknown: ['b-dim', '未知'], skipped: ['b-dim', '未判分']
  };
  const m = map[v.diffVerdict] || ['b-dim', v.diffVerdict];
  // ★ 降级交付的暴力解必须盖在 AC 前头：那个"差分 AC"只证明**那份暴力解**是对的，
  //   不证明这一档解出了这道题。原来这里只映射 diffVerdict，于是题卡上照样显示"差分 AC"，
  //   和标题行、阶梯一起把 6/8 撑成了假的能力证据（实测踩过：2089E/2081E/2081G1）。
  //   降级时原来的判词仍以暗色附在后面 —— 证据不能被藏。
  let s = ((v.deliveredBrute || isDegradedRec(r)))
    ? '<span class="badge b-warn">⚠ 交的是暴力解（不算 AC）</span> <span class="badge b-dim">' + esc(m[1]) + '：那份暴力解</span>'
    : '<span class="badge ' + m[0] + '">' + esc(m[1]) + '</span>';
  if (v.sampleVerdict === 'WA') s += ' <span class="badge b-bad">样例 WA</span>';
  if (v.sampleVerdict === 'special-judge') s += ' <span class="badge b-warn">样例对不上（多解题，可能仍合法）</span>';
  if (v.falseConfidence) s += ' <span class="badge b-bad">假自信</span>';
  if (v.diffUnreliable) s += ' <span class="badge b-warn">这一格不可判</span>';
  return s;
}

function renderSummary() {
  const c = S.compare;
  const d = S.defaults;
  let html = '<h2>总览（合格线 = 不差于 L0）</h2>';
  if (!c || !c.n) {
    html += '<div class="dim">还没有配对结论：对同一批题跑齐 <b>L0</b> 与 <b>L2</b>，再点"判分 + 配对比较"。</div>';
  } else {
    const und = c.undecidable || { count: 0, items: [] };
    html += '<div class="kpi">'
      + '<div>配对题数<b>' + c.n + (c.decidable != null && c.decidable !== c.n ? '<span class="small dim"> 可判 ' + c.decidable + '</span>' : '') + '</b></div>'
      + '<div>L2 更好<b style="color:var(--ok)">' + c.win + '</b></div>'
      + '<div>打平<b>' + c.tie + '</b></div>'
      + '<div>L0 更好<b style="color:var(--bad)">' + c.loss + '</b></div>'
      + '<div>不差于 L0<b style="color:' + (c.notWorseRate == null ? '' : (c.notWorseRate >= 0.5 ? 'var(--ok)' : 'var(--bad)')) + '">' + (c.notWorseRate == null ? '—' : pct(c.notWorseRate)) + '</b></div>'
      + '<div>判不了<b style="color:' + (und.count ? 'var(--warn)' : '') + '">' + und.count + '</b></div>'
      + '<div>McNemar p<b>' + (c.p == null ? '—' : c.p.toFixed(3)) + '</b></div>'
      + '<div>假自信率<b>' + (c.falseConfidence.asserted ? pct(c.falseConfidence.rate) + '<span class="small dim"> ' + c.falseConfidence.assertedWrong + '/' + c.falseConfidence.asserted + '</span>' : '—') + '</b></div>'
      + '<div>人工判定<b class="small">' + c.quality.total + ' 题</b></div>'
      + '</div>';
    if (und.count) {
      html += '<div class="small" style="color:var(--warn);margin-top:6px">⚠️ ' + und.count + ' 对题判不了，<b>没有算进胜平负</b>：'
        + und.items.map((x) => esc(x.problem) + '（' + esc(x.why === 'special-judge' ? '多解题没 checker' : '尺子坏了：' + x.why) + '）').join('、')
        + '　→ 尺子（oracle）自己过不了官方样例时，正确解答会被判成 WA，所以这一格只能空着。</div>';
    }
    if ((c.discordant.candBetter + c.discordant.baseBetter) < 6) {
      html += '<div class="small dim" style="margin-top:6px">不一致格子只有 ' + (c.discordant.candBetter + c.discordant.baseBetter) + ' 个：p 值此时没有判别力（只是"没发现差异"，不是"证明相等"）。要下结论至少 6 个不一致格子。</div>';
    }
    html += '<div class="small dim" style="margin-top:6px">成本：' + Object.entries(c.byLevel).map(([lv, g]) => lv + ' 平均 ' + g.avgTokens + ' tok' + (g.avgCost != null ? ' / ' + money(g.avgCost) : '') + '（n=' + g.runs + '）').join('　') + '</div>';
    html += '<div class="small dim">人工判定（讲解质量）：L2 更好 ' + c.quality.coach + '，打平 ' + c.quality.tie + '，L0 更好 ' + c.quality.l0 + (c.quality.other ? '，其他 ' + c.quality.other : '') + '</div>';
  }
  html += '<div class="small dim" style="margin-top:6px">当前设置：对拍 ' + d.iterations + ' 组，L2 语言 ' + d.lang + '，深度 ' + d.depth + '，图文文档 ' + (d.rich ? '开' : '关') + '；数据目录 ' + esc(S.root) + '</div>';
  if (S.problems.some((p) => !p.hasOracle)) html += '<div class="small" style="color:var(--warn);margin-top:4px">⚠️ 有题缺 oracle：只能算样例级证据（不冒充差分 AC）。用题解当 oracle 时记得把题解代码贴上。</div>';
  $('summary').innerHTML = html;
}

/* ---------------- rating 阶梯：直面"这一档的上限在哪" ---------------- */

/**
 * 阶梯的**规则不在这里**：服务端 `ablation/lib/ladder.js` 是唯一实现，
 * 随 /api/state 的 `ladder` 字段送过来（诊断包里也是同一份）。
 * 界面只负责渲染 —— 读数规则一旦被抄成第二份，走样的方向永远是"把上限报低"。
 */
const KIND_CLS = {
  ac: 'b-ok', fail: 'b-bad', unfinished: 'b-warn', nocode: 'b-dim',
  degraded: 'b-warn', unreliable: 'b-warn', noruler: 'b-warn', ran: 'b-dim', none: 'b-dim'
};

function renderCeiling() {
  const L = S.ladder;
  if (!L) {
    $('ceiling').innerHTML = '<div class="dim">没有收到 rating 阶梯数据（工作台服务是旧的）：重启 <code>node ablation/serve.js</code> 再刷新这一页。</div>';
    return;
  }
  if (!(L.rows || []).length) { $('ceiling').innerHTML = '<div class="dim">还没有题：加题（带 rating）后这里会按 rating 排成阶梯。</div>'; return; }

  const levels = (L.levels || []).map((g) => g.level);
  const t = L.totals || {};
  let html = '<div class="kpi">';
  for (const g of (L.levels || [])) {
    const st = g.stats || { n: 0 };
    html += '<div>' + esc(g.level) + '<span class="small dim"> ' + esc(g.hint || (S.levelHint && S.levelHint[g.level]) || '') + '</span>'
      + '<b>' + (g.acMax ? 'r' + g.acMax.rating : '—') + '</b>'
      + '<span class="small dim">' + (g.acMax ? '最高差分 AC：' + esc(g.acMax.id) : '还没有差分 AC') + '</span>'
      + '<span class="small dim">' + (g.failMin ? '首次可信失败：r' + g.failMin.rating + '（' + esc(g.failMin.id) + '）' : '没有可信失败') + '</span>'
      + '<span class="small dim">' + esc(g.verdict || '') + '（' + (st.n || 0) + ' 次）</span></div>';
  }
  html += '</div>';
  if (t.degraded) {
    html += '<div class="small" style="color:var(--warn);margin:6px 0">⚠️ 这批数据里有 <b>' + t.degraded + '</b> 次是**降级交付的暴力解**（题解 Agent 没交出自己的解，链把暴力解交了上来）：'
      + '阶梯里它们单列成「⚠ 交的是暴力解」，<b>既不算 AC 也不算答错</b>，也不参与"会做 ≤ rX"的结论 —— 见下面标 ⚠ 的格子。</div>';
  }
  html += '<div class="small dim" style="margin:6px 0">读法：' + esc(L.note || '') + '</div>';
  html += '<div class="small dim" style="margin:6px 0">稳健性：' + esc(L.evidence || '') + '</div>';

  html += '<table class="ladder"><thead><tr><th style="width:70px">rating</th><th style="width:110px">题</th>'
    + levels.map((lv) => '<th>' + esc(lv) + '</th>').join('') + '<th>跑况（token / 中止 / 撞顶 / 花费）</th></tr></thead><tbody>';
  for (const r of (L.rows || [])) {
    html += '<tr><td><b>' + (r.rating ? r.rating : '—') + '</b></td><td><a href="#" data-open="' + esc(r.id) + '">' + esc(r.id) + '</a></td>';
    for (const lv of levels) {
      const c = (r.cells && r.cells[lv]) || { kind: 'none', text: '未跑' };
      let cell = '<span class="badge ' + (KIND_CLS[c.kind] || 'b-dim') + '">' + esc(c.text) + '</span>';
      if (c.n > 1) cell += ' <span class="small dim">' + c.n + ' 遍·有码 ' + (c.withCode || 0) + '</span>';
      if (c.falseConfidence) cell += ' <span class="badge b-bad">假自信</span>';
      html += '<td class="lv-cell">' + cell + '</td>';
    }
    // 跑况取所有档的合计（一眼看出这道题是不是在"烧钱没结果"）
    const s = r.stats || { n: 0 };
    const mins = s.n ? Math.round((s.ms || 0) / 60000) : 0;
    html += '<td class="small">' + (s.n ? (s.n + ' 次 · 输出 ' + (s.out || 0).toLocaleString() + ' tok · ' + mins + ' 分钟'
      + (s.priced ? ' · ' + money(s.cost) + (s.priced < s.n ? '<span class="dim">（' + (s.n - s.priced) + ' 次未计费/中止）</span>' : '') : '')
      + (s.aborted ? ' · <span style="color:var(--warn)">中止 ' + s.aborted + '</span>' : '')
      + (s.truncated ? ' · <span style="color:var(--warn)">撞顶 ' + s.truncated + '</span>' : '')
      + (s.degraded ? ' · <span style="color:var(--warn)">交暴力解 ' + s.degraded + '</span>' : '')) : '<span class="dim">—</span>') + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table>';

  if (t.aborted || t.truncated) {
    html += '<div class="small" style="color:var(--warn);margin-top:6px">⚠️ 这批数据里有 <b>' + (t.aborted || 0) + '</b> 次被中止、<b>' + (t.truncated || 0) + '</b> 次撞长度上限：'
      + '它们不是答错，统计时别算进"不会做"。跑难题把上面的「单次超时」调到 32 分钟。</div>';
  }
  if (t.unpriced) html += '<div class="small dim" style="margin-top:4px">另有 ' + t.unpriced + ' 次没有花费记录（中止/异常），成本统计会偏低。</div>';
  const lower = (L.levels || []).filter((g) => g.acMax).map((g) => g.level + ' 至少 r' + g.acMax.rating);
  if (lower.length) html += '<div class="small dim" style="margin-top:4px">下界（已证能到这）：' + esc(lower.join('；')) + '。</div>';
  $('ceiling').innerHTML = html;
  document.querySelectorAll('#ceiling [data-open]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); openDetail(a.dataset.open); }));
}

function renderProblems() {
  /** 这题能不能判出结论（不能判的题烧钱不产数据，实测两道就吃掉 91 分钟 / ¥10.6）。 */
  function undecidableOf(id) {
    const vs = (S.verdicts || []).filter((v) => v.problem === id);
    if (!vs.length) return null;
    if (vs.some((v) => v.oracleSampleMismatch)) return '尺子与官方样例不符（多解的另一种合法答案，或贴错题）→ 核对 oracle';
    const multi = vs.every((v) => v.specialJudge);
    if (multi && !vs.some((v) => v.diffVerdict === 'AC')) return '多解题且没有 checker → 差分跑不起来';
    return null;
  }
  const rows = (S.problems || []).map((p) => {
    const r0 = recOf('L0', p.id); const r2 = recOf('L2', p.id); const r1 = recOf('L1', p.id); const r0c = recOf('L0C', p.id);
    const r0p = recOf('L0+', p.id);
    const v0 = verdictOf('L0', p.id); const v2 = verdictOf('L2', p.id); const v0c = verdictOf('L0C', p.id);
    const h = humanOf(p.id);
    const und = undecidableOf(p.id);
    const choiceTxt = h ? ({ coach: 'L2 更好', l2: 'L2 更好', tie: '打平', l0: 'L0 更好', base: 'L0 更好', 'both-bad': '两个都不行', 'both-good': '两个都好' }[String(h.choice).toLowerCase()] || h.choice) : '';
    return '<tr class="' + (detailId === p.id ? 'sel' : '') + '">'
      + '<td><input type="checkbox" data-id="' + esc(p.id) + '"' + (sel.has(p.id) ? ' checked' : '') + '></td>'
      + '<td><b>' + esc(p.id) + '</b>' + (p.rating ? '<div class="small dim">' + esc(p.rating) + '</div>' : '') + '</td>'
      + '<td><a href="#" data-open="' + esc(p.id) + '">' + esc(p.title || '') + '</a>'
      + (p.url ? ' <a class="small" href="' + esc(p.url) + '" target="_blank">CF</a>' : '')
      + '<div class="small dim">' + (p.samples || []).length + ' 组样例 · ' + (p.hasOracle ? 'oracle ' + esc(p.oracleLang) : '<span style="color:var(--warn)">无 oracle</span>') + (p.hasGen ? ' · 有生成器' : ' · <span style="color:var(--warn)">无生成器</span>') + (p.note ? ' · ' + esc(p.note) : '') + '</div>'
      + (und ? '<div class="small" style="color:var(--warn)">判不了：' + esc(und) + '</div>' : '')
      + '<label class="small dim" title="标了跳过就不会进跑分队列（左上角勾「连判不了的题一起跑」可以临时收回）。判不了的题只烧钱不产数据：实测两道吃掉 91 分钟 / ¥10.6。"><input type="checkbox" data-skip="' + esc(p.id) + '"' + (p.skip ? ' checked' : '') + '> 跳过这题</label></td>'
      + '<td>' + (r0 ? verdictBadge(v0, r0) : '<span class="badge b-dim">未跑</span>')
      + (r0c ? '<div class="small" style="margin-top:3px">L0C ' + verdictBadge(v0c, r0c) + '</div>' : '')
      + (r0p ? '<div class="small" style="margin-top:3px">L0+ ' + verdictBadge(verdictOf('L0+', p.id), r0p) + '</div>' : '')
      + (r1 ? '<div class="small" style="margin-top:3px">L1 ' + verdictBadge(verdictOf('L1', p.id), r1) + '</div>' : '') + '</td>'
      + '<td>' + (r2 ? verdictBadge(v2, r2) + (r2.assertedVerified ? '<div class="small"><span class="badge ' + (r2.verificationStatus === 'ok' && r2.scopeComplete ? 'b-ok' : 'b-warn') + '">' + esc(r2.verificationStatus || '') + (r2.scopeComplete ? '（完整）' : '（不完整）') + '</span></div>' : '') : '<span class="badge b-dim">未跑</span>') + '</td>'
      + '<td class="small">' + (choiceTxt ? esc(choiceTxt) : '<span class="dim">—</span>') + (h && h.note ? '<div class="dim">' + esc(h.note) + '</div>' : '') + '</td>'
      + '<td><button data-edit="' + esc(p.id) + '">编辑</button></td>'
      + '</tr>';
  }).join('');
  $('problems').innerHTML = '<table><thead><tr><th style="width:28px"></th><th>题号</th><th>标题 / 素材</th><th>L0</th><th>L2（cf-coach）</th><th>人工判定</th><th></th></tr></thead><tbody>' + (rows || '<tr><td colspan="7" class="dim">还没有题：点右上角「＋ 加题」，粘题面 + 贴一份题解当 oracle。</td></tr>') + '</tbody></table>';
  document.querySelectorAll('input[data-id]').forEach((cb) => cb.addEventListener('change', () => { cb.checked ? sel.add(cb.dataset.id) : sel.delete(cb.dataset.id); }));
  document.querySelectorAll('input[data-skip]').forEach((cb) => cb.addEventListener('change', async () => {
    const id = cb.dataset.skip;
    try {
      await api('/api/problems', { id, skip: cb.checked });
      logLine((cb.checked ? '已标记跳过：' : '已取消跳过：') + id + '（其余字段沿用原记录）');
      await refresh();
    } catch (e) { logLine('改跳过标记失败：' + e.message); }
  }));
  document.querySelectorAll('[data-open]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); openDetail(a.dataset.open); }));
  document.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => openEdit(b.dataset.edit)));
}

function render() { if (!S) return; $('modelInfo').textContent = (S.targets || []).map((t) => t.providerId + '::' + t.model).join('　'); renderSummary(); renderCeiling(); renderProblems(); if (detailId) openDetail(detailId); }

async function openDetail(id) {
  detailId = id;
  const p = (S.problems || []).find((x) => x.id === id);
  if (!p) return;
  const r0 = recOf('L0', id); const r2 = recOf('L2', id); const v0 = verdictOf('L0', id); const v2 = verdictOf('L2', id);
  const h = humanOf(id);
  $('detailSection').style.display = 'block';
  $('detailTitle').innerHTML = '对比：' + esc(id) + ' ' + esc(p.title || '') + ' <span class="small dim">（' + (p.samples || []).length + ' 组样例）</span>';
  const ansCell = (r, level) => {
    if (!r) return '<div class="dim">这一档还没跑（勾选这道题 → 跑选中题）</div>';
    let s = '';
    if (r.error) s += '<div class="badge b-bad">错误：' + esc(r.error) + '</div>';
    s += '<div class="small dim">' + (r.ms ? (r.ms / 1000).toFixed(1) + 's · ' : '') + ((r.usage && (r.usage.promptTokens + '+' + r.usage.completionTokens + ' tok')) || '') + ' ' + (r.cost ? '· ' + money(r.cost.amount) : '') + ' · 来源 ' + esc(r.codeSource || '—') + '</div>';
    if (level === 'L2' && r.verificationStatus) {
      const ok = r.verificationStatus === 'ok' && r.scopeComplete;
      s += '<div class="row"><span class="badge ' + (ok ? 'b-ok' : (r.verificationStatus === 'ok' ? 'b-warn' : 'b-dim')) + '">链自评：' + esc(r.verificationStatus) + (r.scopeComplete ? '（完整）' : '（不完整）') + '</span>'
        + '<span class="badge b-dim">交付：' + esc(r.delivered || '—') + '</span></div>';
      if (r.scopeNote) s += '<div class="small dim">覆盖范围：' + esc(r.scopeNote) + '</div>';
      if (r.docFile) s += '<iframe src="/api/doc/' + encodeURIComponent(r.docFile) + '"></iframe>';
      const traj = (r.trajectory || []).map((t) => '· ' + esc(t.kind) + (t.note ? '：' + esc(t.note) : '')).join('<br>');
      if (traj) s += '<details><summary class="small dim">验证过程中发生了什么（' + (r.trajectory || []).length + ' 步）</summary><div class="small">' + traj + '</div></details>';
    }
    if (r.code) s += '<div class="small dim">最终代码（' + esc(r.codeLang || '') + '）</div><pre>' + esc(r.code) + '</pre>';
    if (level === 'L0' && r.answerName) s += '<details><summary class="small dim">模型原文回答</summary><pre id="ans-' + level + '">加载中…</pre></details>';
    return s;
  };
  const verdictLine = (v, level, rec) => {
    if (!v) return '<span class="badge b-dim">' + level + ' 未判分</span>';
    return '<span class="badge b-dim">' + level + '</span> ' + verdictBadge(v, rec)
      + (v.assertedVerified != null ? ' <span class="badge ' + (v.assertedVerified ? (v.falseConfidence ? 'b-bad' : 'b-ok') : 'b-dim') + '">' + (v.assertedVerified ? (v.falseConfidence ? '声称已验证但被 oracle 判错（假自信）' : '声称已验证且确实对') : '没有声称已验证') + '</span>' : '')
      + (v.detail ? '<div class="small dim">' + esc(v.detail) + '</div>' : '');
  };
  const choices = [['coach', 'L2 更好'], ['tie', '打平'], ['l0', 'L0 更好'], ['both-bad', '两个都不行'], ['both-good', '两个都好']];
  $('detail').innerHTML = '<div class="grid2">'
    + '<div class="card"><h2>L0 裸模型（一次调用，无工具）</h2>' + ansCell(r0, 'L0') + '</div>'
    + '<div class="card"><h2>L2 cf-coach（工具链 + 验证 + 图文）</h2>' + ansCell(r2, 'L2') + '</div>'
    + '</div>'
    + '<div class="card"><h2>判分（外部 oracle 差分 = 硬指标）</h2>' + verdictLine(v0, 'L0', recOf('L0', id)) + '<div style="height:6px"></div>' + verdictLine(v2, 'L2', recOf('L2', id)) + '</div>'
    + '<div class="card"><h2>人工判定（讲解质量 = 真正的轴）</h2>'
    + '<div class="row choice">' + choices.map(([v, t]) => '<button data-choice="' + v + '" class="' + (h && String(h.choice).toLowerCase() === v ? 'on' : '') + '">' + t + '</button>').join('') + '</div>'
    + '<div class="row"><input id="h_note" placeholder="为什么（哪个更容易学会？哪里卡住？）" style="flex:1" value="' + esc(h && h.note || '') + '">'
    + '<button id="btnHSave">保存人工判定</button>'
    + '<span class="small dim">已判 ' + (S.human || []).length + ' 次</span></div></div>';
  document.querySelectorAll('[data-choice]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-choice]').forEach((x) => x.classList.remove('on')); b.classList.add('on');
  }));
  $('btnHSave').addEventListener('click', async () => {
    const on = document.querySelector('[data-choice].on');
    if (!on) return logLine('先选一个判定（谁更好）');
    try {
      await api('/api/human', { problem: id, choice: on.dataset.choice, note: $('h_note').value });
      logLine('记下人工判定：' + id + ' → ' + on.textContent);
      await refresh();
    } catch (e) { logLine('保存失败：' + e.message); }
  });
  const a0 = document.getElementById('ans-L0');
  if (a0 && r0 && r0.answerName) {
    fetch('/api/answer/' + encodeURIComponent(r0.answerName)).then((x) => x.text()).then((t) => { a0.textContent = t; }).catch(() => { a0.textContent = '读不到'; });
  }
}

function msg(t) { $('fetchMsg').textContent = t || ''; }

/** 把题目填进对话框。keepTyped=true 时不动用户已经打好的 oracle/生成器/备注（取题回来时别覆盖手上的代码） */
function applyProblemToForm(p, keepTyped) {
  $('f_id').value = p.id; $('f_title').value = p.title || ''; $('f_rating').value = p.rating || '';
  $('f_url').value = p.url || ''; $('f_statement').value = p.statement || '';
  $('f_samples').value = (p.samples || []).length ? JSON.stringify(p.samples, null, 1) : '';
  if (!keepTyped || !$('f_oracleCode').value.trim()) {
    $('f_oracleCode').value = p.oracleCode || ''; $('f_oracleLang').value = p.oracleLang || 'python';
  }
  if (!keepTyped || !$('f_genCode').value.trim()) {
    $('f_genCode').value = p.genCode || ''; $('f_genLang').value = p.genLang || 'python';
  }
  if (!keepTyped || !$('f_note').value.trim()) $('f_note').value = p.note || '';
}

function openEdit(id) {
  editing = id || null;
  const p = id ? (S.problems || []).find((x) => x.id === id) : null;
  $('dlgTitle').textContent = p ? ('编辑 ' + p.id) : '加题';
  $('btnDelete').style.display = p ? '' : 'none';
  ['f_ref', 'f_id', 'f_title', 'f_rating', 'f_url', 'f_statement', 'f_samples', 'f_oracleCode', 'f_genCode', 'f_note'].forEach((k) => { $(k).value = ''; });
  msg('');
  if (p) applyProblemToForm(p, false);
  dlg.showModal();
}

/** 表单 → /api/problems 的请求体（题号必填；样例留空 = 服务端从题面自动解析） */
function formBody() {
  const id = $('f_id').value.trim();
  if (!id) throw new Error('题号不能空');
  let samples = null;
  const raw = $('f_samples').value.trim();
  if (raw) { try { samples = JSON.parse(raw); } catch (err) { throw new Error('样例 JSON 解析失败：' + err.message); } }
  return {
    problem: {
      id, title: $('f_title').value, rating: $('f_rating').value, url: $('f_url').value,
      statement: $('f_statement').value, note: $('f_note').value,
      oracleLang: $('f_oracleLang').value, oracleCode: $('f_oracleCode').value,
      genLang: $('f_genLang').value, genCode: $('f_genCode').value,
      samples: samples && samples.length ? samples : []
    }
  };
}

async function saveProblem() {
  const body = formBody();
  const r = await api('/api/problems', body);
  const fix = (r.problem.langFix || []).map((f) => f.which + ' 语言按代码内容 ' + f.from + ' → ' + f.to);
  logLine('保存 ' + body.problem.id + '：样例 ' + r.problem.samples + ' 组，oracle ' + (r.problem.hasOracle ? '有' : '无') + '，生成器 ' + (r.problem.hasGen ? '有' : '无')
    + (fix.length ? '；' + fix.join('；') : ''));
  if (fix.length) msg('（已自动纠正：' + fix.join('；') + '　—— 整块粘贴带进来的 ``` 围栏也会自动去掉）');
  return r;
}

$('form').addEventListener('submit', async (e) => {
  const action = (e.submitter && e.submitter.value) || 'cancel';
  if (action === 'cancel') return;   // method=dialog 自己关
  e.preventDefault();
  if (action === 'delete') {
    if (!editing) return;
    await api('/api/problems/delete', { id: editing }); logLine('删掉题目 ' + editing); dlg.close(); return refresh();
  }
  try {
    const r = await saveProblem();
    sel.add(r.problem.id); dlg.close(); await refresh();
  } catch (err) { logLine('保存失败：' + err.message); }
});

/** 从 CF 取题：复用应用自己的取题通道（题面/样例/标题/难度一次到手，用户只需要再贴 oracle） */
$('btnFetch').addEventListener('click', async () => {
  const ref = ($('f_ref').value || $('f_id').value).trim();
  if (!ref) return msg('先填题号（如 1800C）或直接贴题目链接');
  const btn = $('btnFetch');
  btn.disabled = true; btn.textContent = '取题中…';
  msg('取题中：借应用内嵌浏览器过 CF 反爬（约 20–60 秒），右边的「事件」栏有进度');
  try {
    const r = await api('/api/cf-fetch', { ref });
    await refresh();
    const p = (S.problems || []).find((x) => x.id === r.id);
    if (p) applyProblemToForm(p, true);
    $('f_ref').value = r.id;
    msg('已入库 ' + r.id + '：题面 ' + r.statementLen + ' 字，样例 ' + r.samples + ' 组'
      + (r.hasOracle ? '，oracle 已有（没被覆盖）' : '，还缺 oracle：贴一份你自己的 AC 题解'));
    logLine('取题成功：' + r.id + ' ' + r.title);
  } catch (err) {
    msg('取题失败：' + err.message + '　→ CF 反爬是偶发的，再点一次通常就过；也可以直接把题面粘进来');
    logLine('取题失败：' + err.message);
  } finally { btn.disabled = false; btn.textContent = '从 CF 取题'; }
});

/**
 * 导应用缓存：直接读应用自己抓过的题面缓存（data/cf-problems/<题号>.json）。
 * 这条路**不联网、不过反爬**，是"现场取题被 Cloudflare 拦死"时最靠谱的退路：
 * 只要你在应用里成功打开过一次这道题，题面就已经落盘了。
 */
$('btnImport').addEventListener('click', async () => {
  const ref = ($('f_ref').value || $('f_id').value).trim();
  if (!ref) return msg('先填题号（如 4A）；应用缓存里的题：' + (((S.appCache || {}).ids) || []).join('、'));
  const btn = $('btnImport');
  btn.disabled = true; btn.textContent = '导入中…';
  try {
    const r = await api('/api/import-cache', { ref });
    await refresh();
    const p = (S.problems || []).find((x) => x.id === r.id);
    if (p) applyProblemToForm(p, true);
    $('f_ref').value = r.id;
    msg('已从应用缓存导入 ' + r.id + '：题面 ' + r.statementLen + ' 字，样例 ' + r.samples + ' 组'
      + (r.hasOracle ? '，oracle 已有（没被覆盖）' : '，还缺 oracle：贴一份你自己的 AC 题解'));
    logLine('导入成功：' + r.id + ' ' + r.title);
  } catch (err) {
    msg('导入失败：' + err.message);
    logLine('导入失败：' + err.message);
  } finally { btn.disabled = false; btn.textContent = '导应用缓存'; }
});

/** 自动写生成器：先存题（服务器要读落盘的 oracle），再让模型写 + 跑代码体检 */
$('btnGen').addEventListener('click', async () => {
  const btn = $('btnGen');
  msg('');
  try {
    const saved = await saveProblem();
    const id = saved.problem.id;
    if (!saved.problem.hasOracle) { msg('这题还没有 oracle：先贴一份你自己的 AC 题解，生成器要照它的输入格式写'); return; }
    btn.disabled = true; btn.textContent = '写生成器中…';
    msg('写生成器：一次模型调用 + 跑代码体检（能不能跑、数据会不会把你的 oracle 跑崩、是不是每次都一样）…');
    const g = await api('/api/make-gen', { id });
    $('f_genLang').value = g.lang; $('f_genCode').value = g.code;
    const warn = (g.gate && g.gate.warnings) || [];
    msg('生成器已写入（' + g.lang + '，体检通过' + (warn.length ? '，提醒：' + warn.join('；') : '') + '）');
    logLine('生成器已写入：' + id + (warn.length ? '（' + warn.join('；') + '）' : ''));
  } catch (err) {
    // 报错分清"生成器不行"和"oracle 本身不行"：后者别再去改生成器
    const broken = !!(err && err.data && err.data.oracleBroken);
    const m = (err && err.message) || String(err);
    msg((broken ? 'oracle 有问题，先修 oracle：' : '自动写生成器失败：') + m
      + (broken ? '　→ 上去把 oracle 框里的 ``` 围栏去掉、语言选成和代码一致，再点一次' : ''));
    logLine((broken ? 'oracle 有问题：' : '自动写生成器失败：') + m);
  } finally { btn.disabled = false; btn.textContent = '自动写生成器'; }
});


$('btnAdd').addEventListener('click', () => openEdit(null));
$('btnRunSel').addEventListener('click', () => startRun(Array.from(sel), false));
$('btnRunAll').addEventListener('click', () => startRun(Array.from(sel).length ? Array.from(sel) : (S.problems || []).map((p) => p.id), false));
$('btnJudge').addEventListener('click', async () => {
  try { await api('/api/judge', { iterations: Number($('it').value) || 60 }); logLine('开始判分…'); } catch (e) { logLine('判分失败：' + e.message); }
});
$('btnGens').addEventListener('click', async () => {
  const todo = (S.problems || []).filter((p) => p.hasOracle && !p.hasGen);
  if (!todo.length) return logLine('没有要补的：有 oracle 的题都已经有生成器了');
  logLine('补生成器：' + todo.length + ' 题（' + todo.map((p) => p.id).join('、') + '）——一题一次模型调用 + 跑代码体检，慢慢来');
  try {
    await api('/api/make-gens', { ids: todo.map((p) => p.id), onlyMissing: true });
    $('progress').textContent = '补生成器 0/' + todo.length;
  } catch (e) { logLine('补生成器失败：' + e.message); }
});
$('btnCancel').addEventListener('click', async () => { try { await api('/api/cancel', {}); logLine('已请求取消'); } catch (e) { logLine(e.message); } });
$('btnExport').addEventListener('click', async () => {
  const d = await (await fetch('/api/export')).json();
  const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'ablation-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json'; a.click();
});

$('btnDiag').addEventListener('click', async () => {
  // 测试是在别的机器上跑的：这个按钮是"把现场装进一个文件"的唯一出口。
  // 走 fetch 而不是直接 <a href="/api/diag/export">，是为了拿到回执 ——
  // 测试者要知道"我发出去的是什么、多大、含哪些段"，否则他只能猜自己该发什么。
  logLine('正在生成诊断包（环境 / 运行日志 / 题库台账 / 每一跑的工具轨迹 / 判分与 rating 阶梯）…');
  try {
    const r = await fetch('/api/diag/export');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    const name = (String(r.headers.get('content-disposition') || '').match(/filename="([^"]+)"/) || [])[1]
      || ('cfcoach-diag' + (S && S.host ? '-' + S.host : '') + '.txt');
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    const kb = Math.max(1, Math.round(text.length / 1024));
    const sections = (text.match(/^#+ .+? #+$/gm) || []).map((s) => s.replace(/#+/g, '').trim());
    logLine('诊断包已下载：<b>' + esc(name) + '</b>（' + kb + ' KB，' + text.split('\n').length + ' 行）'
      + (sections.length ? '<br>含 ' + sections.length + ' 段：' + esc(sections.slice(0, 12).join(' / ')) : ''));
    logLine('把<b>这一个文件</b>发回来就行（纯文本，可直接贴聊天窗口）。它已打码 apiKey/cookie/邮箱/用户名，'
      + '并且不含你写的解题代码正文；同目录还留着完整日志：' + esc((S && S.logFile) || 'server.log'));
  } catch (e) {
    logLine('诊断包生成失败：' + esc(e.message) + '（也可以直接开 ' + esc((S && S.logFile) || '数据目录/server.log') + ' 发回来）');
  }
});

async function startRun(ids, all) {
  if (!ids.length) return logLine('先勾选要跑的题（或点「跑全部」）');
  const pick = [['lvL0', 'L0'], ['lvL0C', 'L0C'], ['lvL0P', 'L0+'], ['lvL1', 'L1'], ['lvL2', 'L2']];
  const levels = pick.filter(([id]) => $(id) && $(id).checked).map(([, lv]) => lv);
  if (!levels.length) return logLine('先勾一个档位（L0 裸模 / L0 只给代码块 / L1 agent / L2 cf-coach）');
  const reps = Number($('reps').value) || 1;
  const callTimeoutMin = Number($('timeout').value) || 12;
  const conc = Number($('conc') && $('conc').value) || 4;
  const plan = ($('plan') && $('plan').value) || 'full';
  const includeSkipped = !!($('includeSkipped') && $('includeSkipped').checked);
  try {
    await api('/api/run', {
      ids, levels, reps, callTimeoutMin, conc, plan, includeSkipped,
      iterations: Number($('it').value) || 60, lang: $('lang').value, depth: $('depth').value, rich: $('rich').checked
    });
    logLine('开始跑分：' + ids.length + ' 题 × ' + levels.join('/')
      + (plan === 'full' ? (reps > 1 ? ' × ' + reps + ' 遍' : '')
        : '（' + (plan === 'sweep' ? '先各跑 1 遍' : (plan === 'ladder' ? '只补阶梯缝 ' + reps + ' 遍' : '补齐到每格 ' + reps + ' 条，已有记录的格跳过')) + '）')
      + '（并发 ' + conc + ' 题，同题串行；单次超时 ' + callTimeoutMin + ' 分钟）');
  } catch (e) { logLine('启动失败：' + e.message); }
}

async function refresh() {
  S = await (await fetch('/api/state')).json();
  render();
  const cache = (S && S.appCache) || { ids: [] };
  const ids = cache.ids || [];
  if ($('cacheHint')) {
    const dir = (S && S.appDataDir) || (cache && cache.dir) || '';
    $('cacheHint').textContent = (ids.length
      ? ('应用抓过的题：' + ids.join('、') + '（点「导应用缓存」直接导入，不用再过反爬）')
      : '应用题面缓存是空的：在应用里成功打开一次某道题，题面就会落盘')
      + (dir ? ('｜应用数据目录：' + dir) : '');
  }
  // 这台机器是谁 + 日志在哪：测试在别的机器上跑，收包的人与发包的人都要一眼看得到
  if ($('hostHint')) {
    $('hostHint').innerHTML = '这台机器：<b>' + esc((S && S.host) || '?') + '</b>'
      + '｜数据目录：' + esc((S && S.root) || '?')
      + '｜运行日志：' + esc((S && S.logFile) || 'server.log')
      + '　—— 出问题就点「导出诊断包（发回日志）」，把下载到的那个 <b>.txt</b> 发回来。';
  }
  // 刷新页面时把"正在跑哪几道题"接回来（并发下只看最后一条会误判成串行）
  if (S && S.job && S.job.running) {
    const a = S.job.active || [];
    $('progress').textContent = '跑 ' + (a.length ? a.join(' ＋ ') : (S.job.current || '—'))
      + '（' + S.job.done + '/' + S.job.total + (a.length > 1 ? '，并发 ' + a.length : '') + '）…';
  }
}

const es = new EventSource('/api/events');
const seen = new Set();
// 现在是并发的：进度条只显示最后一条会看不出同时在跑几道题，所以自己维护"正在跑"的集合
const activeJobs = new Set();
function tickProgress(done, total) {
  const a = Array.from(activeJobs);
  $('progress').textContent = '跑 ' + (a.length ? a.join(' ＋ ') : '—')
    + '（' + done + '/' + total + (a.length > 1 ? '，并发 ' + a.length : '') + '）…';
}
es.onmessage = (ev) => {
  let e; try { e = JSON.parse(ev.data); } catch { return; }
  const key = e.type + '|' + (e.name || '') + '|' + (e.done != null ? e.done : '') + '|' + e.at;
  if (seen.has(key)) return; seen.add(key);
  if (e.type === 'log') logLine(e.text);
  else if (e.type === 'jobStart') { activeJobs.add(e.name); tickProgress(e.done, e.total); logLine('▶ ' + e.name); }
  else if (e.type === 'jobDone') {
    activeJobs.delete(e.name);
    if (activeJobs.size) tickProgress(Math.min(e.done, e.total), e.total);
    logLine((e.ok ? '✓' : '✗') + ' ' + e.name + '  ' + Math.round((e.ms || 0) / 1000) + 's' + (e.error ? '  ' + e.error : '') + (e.verification ? '  链自评 ' + (e.verification.status || '') : '')
      + (e.truncated ? '  ⚠️ 撞长度上限（finish_reason=' + esc(e.finishReason || 'length') + '）' : ''));
    if (/单次模型调用超时/.test(String(e.error || ''))) logLine('　↳ 这次是撞上单次调用超时被中止，<b>不是答错</b>：把「单次超时」调大（难题 32 分钟）再跑。');
    refresh().catch(() => {});
  }
  else if (e.type === 'runEnd') { activeJobs.clear(); $('progress').textContent = '跑完了：' + e.done + '/' + e.total + (e.cancelled ? '（已取消）' : ''); logLine('跑分结束'); refresh().catch(() => {}); }
  else if (e.type === 'verdict') { $('progress').textContent = '判分 ' + e.done + '/' + e.total + '　' + e.verdict.problem + ' ' + e.verdict.level + ' → ' + e.verdict.diffVerdict; }
  else if (e.type === 'judgeStart') { $('progress').textContent = '判分中（每题最多 ' + e.iterations + ' 组对拍）…'; }
  else if (e.type === 'judgeEnd') { $('progress').textContent = '判分完成'; logLine('判分完成：配对 ' + (e.compare && e.compare.n || 0) + ' 题'); refresh().catch(() => {}); }
  else if (e.type === 'genDone') {
    $('progress').textContent = '补生成器 ' + e.done + '/' + e.total;
    logLine((e.ok ? '生成器 ✓ ' : '生成器 ✗ ') + e.id + (e.error ? '：' + e.error : ''));
  }
  else if (e.type === 'gensEnd') { $('progress').textContent = '补生成器结束'; logLine('补生成器结束'); refresh().catch(() => {}); }
  else if (e.type === 'error') logLine('⚠️ ' + e.error);
};

refresh().then(() => { if ((S.problems || []).length) sel = new Set(S.problems.map((p) => p.id)); render(); }).catch((e) => logLine('加载失败：' + e.message));
</script>
